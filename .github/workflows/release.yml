name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          echo "CHANNELSNAP_STORE_FILE=release.jks" >> "$GITHUB_ENV"

      - name: Test and build release APK
        env:
          CHANNELSNAP_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CHANNELSNAP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CHANNELSNAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-${GITHUB_SHA::7}"
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease \
            -PversionName="$VERSION" -PversionCode="${GITHUB_RUN_NUMBER}"

      - uses: actions/upload-artifact@v4
        with:
          name: ChannelSnap-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
